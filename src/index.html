<!doctype html>
   <head lang="en">
      <title>PyTechCo Technology Company Simulator</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anony>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta charset="UTF-8">
      <style>
         body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
         }
         h1 {
            color: #00c6ff;
            text-align: center;
         }
         .container-sm {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,198,255,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
         }
         table { color: #ffffff !important; width: 100%; }
         table tr { border-bottom: 1px solid rgba(255,255,255,0.1); }
         table td { padding: 10px; color: #ffffff !important; }
         .table-warning { background: rgba(255,193,7,0.15) !important; }
         .table-warning td { color: #ffc107 !important; }
         .alert-info {
            background: rgba(0,198,255,0.08) !important;
            border: 1px solid rgba(0,198,255,0.4) !important;
            border-radius: 12px !important;
            color: #ffffff !important;
            padding: 15px !important;
            margin-bottom: 15px !important;
         }
         dt { color: #00c6ff !important; }
         dd { color: #ffffff !important; }
      </style>
   </head>
   <body>
    <h1 class="display-2">&#x1F4BB PyTechCo Simulator &#x1F4BB</h1>
    <h1 class="display-6">&#x1F4C8 Company Stats</h1>
      <div id="stats" class="container-sm">
        {{ stats }}
      </div>
      <h1 class="display-6">&#x1F7E2 Online Employees</h1>
      <div id="online_employees" class="container-sm">
        {{ online_employees }}
      </div>
   </body>
   <script type="text/javascript">
    function update() {
        let stats_elements = document.getElementById("stats");
        let online_employees_element = document.getElementById("online_employees");
        fetch("/stats")
        .then((response) => {
            return response.json();
        })
        .then((data) => {
            console.log(data);
            stats_elements.innerHTML = data["stats"];
        })
        fetch("/employees_online")
        .then((response) => {
            return response.json();
        })
        .then((data) => {
            console.log(data);
            online_employees_element.innerHTML = data["online_employees"];
        })
    }

    (function () {
        update();
        setInterval(function () {
            update();
        }, {{ refresh_interval }});
    })();
</script>
</html>
