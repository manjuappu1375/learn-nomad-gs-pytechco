name: PyTechCo CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push ptc-setup
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-setup:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-setup:${{ github.sha }} \
            -f src/setup.Dockerfile src
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-setup:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-setup:${{ github.sha }}

      - name: Build and push ptc-employee
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-employee:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-employee:${{ github.sha }} \
            -f src/employee.Dockerfile src
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-employee:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-employee:${{ github.sha }}

      - name: Build and push ptc-web
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-web:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-web:${{ github.sha }} \
            -f src/webviewer.Dockerfile src
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-web:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-web:${{ github.sha }}

      - name: Build and push ptc-viewer
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-viewer:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-viewer:${{ github.sha }} \
            -f extra/viewer.Dockerfile extra
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-viewer:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pytechco-viewer:${{ github.sha }}

  nomad-deploy:
    name: Deploy to Nomad via API
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Deploy pytechco-redis
        run: |
          nomad job run -output \
            /home/ubuntu/learn-nomad-getting-started/aws/learn-nomad-gs-pytechco/nomad/pytechco-redis.hcl \
            > /tmp/redis.json
          curl -s -X POST "http://localhost:4646/v1/jobs" \
            -H "Content-Type: application/json" \
            -d @/tmp/redis.json

      - name: Deploy pytechco-web
        run: |
          nomad job run -output \
            /home/ubuntu/learn-nomad-getting-started/aws/learn-nomad-gs-pytechco/nomad/pytechco-web.hcl \
            > /tmp/web.json
          curl -s -X POST "http://localhost:4646/v1/jobs" \
            -H "Content-Type: application/json" \
            -d @/tmp/web.json

      - name: Deploy pytechco-employee
        run: |
          nomad job run -output \
            /home/ubuntu/learn-nomad-getting-started/aws/learn-nomad-gs-pytechco/nomad/pytechco-employee.hcl \
            > /tmp/employee.json
          curl -s -X POST "http://localhost:4646/v1/jobs" \
            -H "Content-Type: application/json" \
            -d @/tmp/employee.json

      - name: Check deployment status
        run: |
          for job in pytechco-redis pytechco-web pytechco-employee; do
            echo "Status of $job:"
            curl -s "http://localhost:4646/v1/job/$job" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print('  Status:', d.get('Status'))"
          done
